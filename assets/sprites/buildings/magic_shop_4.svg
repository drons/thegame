  <rect x="16" y="30" width="32" height="24" fill="#7a6a9e" stroke="#57497a" stroke-width="1"/>
  <polygon points="12,32 32,13 52,32" fill="#4a3a7a" stroke="#372a5c" stroke-width="1"/>
  <polygon points="12,32 32,13 32,32" fill="#584689"/>
  <!-- дверь -->
  <rect x="27" y="40" width="9" height="14" rx="4" fill="#3a2f5c" stroke="#2a2246" stroke-width="1"/>
  <!-- окна светятся (кадр 4: затихают) -->
  <rect x="19.5" y="35" width="6" height="6" fill="#d8b3ff" stroke="#57497a" stroke-width="0.9"/>
  <circle cx="42" cy="38" r="3.8" fill="#d8b3ff" opacity="0.12"/>
  <rect x="39" y="35" width="6" height="6" fill="#d8b3ff" stroke="#57497a" stroke-width="0.9"/>
  <!-- парящий кристалл над дверью (кадр 4: опускается) -->
  <circle cx="31.5" cy="29.2" r="6" fill="#b07ae8" opacity="0.4"/>
  <polygon points="31.5,24.2 34.2,28.8 31.5,33.2 28.8,28.8" fill="#b07ae8" stroke="#7a4ab8" stroke-width="1"/>
  <line x1="31.5" y1="25.7" x2="31.5" y2="31.7" stroke="#e3ccff" stroke-width="0.8" opacity="0.75"/>
  <!-- искры (кадр 4: тускнеют) -->
