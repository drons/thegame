    <ellipse cx="28.5" cy="29" rx="6.5" ry="9.5" fill="#ffffff" opacity="0.4"/>
    <!-- левая рука -->
    <circle cx="16" cy="39" r="3.2" fill="#8fe8fa" stroke="#1c7fa3" stroke-width="1"/>
    <!-- лицо -->
    <circle cx="27.3" cy="33.5" r="2.7" fill="#0d3a4a"/>
    <circle cx="36.7" cy="33.5" r="2.7" fill="#0d3a4a"/>
    <circle cx="28.2" cy="32.6" r="0.9" fill="#ffffff"/>
    <circle cx="37.6" cy="32.6" r="0.9" fill="#ffffff"/>
    <path d="M29 40 Q32 42.8 35 40" stroke="#0d3a4a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- стопы -->
  <ellipse cx="27" cy="55" rx="3.6" ry="2.6" fill="#7fdcf4"/>
  <ellipse cx="39" cy="55" rx="3.6" ry="2.6" fill="#7fdcf4"/>
  <!-- правая рука вынесена вперёд, удар-плеть -->
  <path d="M44 34 C47 34 49.5 34.5 51.5 35" stroke="#8fe8fa" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <circle cx="54" cy="35.5" r="3.4" fill="#8fe8fa" stroke="#1c7fa3" stroke-width="1"/>
  <path d="M52 33 C58 31 62.5 32.5 64.5 35 C62 38 57 39 52.5 37.5 Z" fill="url(#punch)" opacity="0.95"/>
  <g stroke="#ffe9a3" stroke-width="1.4" stroke-linecap="round">
    <path d="M57 27.5 l3.5 -3"/>
    <path d="M59.5 42 l3.5 2"/>
