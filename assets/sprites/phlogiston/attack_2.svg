<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d8fbff" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#7fe3ff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#7fe3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fffe"/>
      <stop offset="0.55" stop-color="#b7f0fb"/>
      <stop offset="1" stop-color="#52c4e8"/>
    </linearGradient>
    <radialGradient id="punch" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#d9fbff"/>
      <stop offset="1" stop-color="#57c8ec"/>
    </radialGradient>
  </defs>
  <circle cx="34" cy="36" r="24" fill="url(#glow)"/>
  <g transform="rotate(9 32 42) translate(1.5,0.5)">
    <!-- языки пламени, сдуты вперёд -->
    <g transform="rotate(10 32 12)">
      <path d="M32 4 C29.5 8.5 28 11.5 28.8 15.5 C30.6 12.6 31.4 10.8 31.7 8.6 C32.4 11.4 33.6 13.8 36 15.2 C36.2 11 34.6 7.4 32 4 Z" fill="#a5ecff" opacity="0.95"/>
