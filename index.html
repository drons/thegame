<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- user-scalable=no — игра: браузерный pinch-zoom ломает on-screen-
       контролы (задача 000018); зум в игре — свой (колесо мыши). -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Приключения Флогистона</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #101418;
    }
    #game {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Слой спрайтов поверх WebGL-канваса (текстуры тайлов, постройки, мобы,
       Флогистон). Клик/колесо должны проходить к #game, поэтому
       pointer-events: none. */
    #sprites {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #hud {
      position: fixed;
      left: 12px;
      top: 12px;
      color: #e8dcc0;
      font: 13px/1.55 ui-monospace, monospace;
      background: rgba(0, 0, 0, 0.45);
      padding: 10px 14px;
      border-radius: 10px;
      pointer-events: none;
      white-space: pre-line;
    }
    /* Полноэкранная двухколоночная панель (задача 000096): накрывает
       карту; bottom:56px — нижняя кромка ВЫШЕ верхней кромки .fs-btn
       (bottom 12 + высота ≈33px = 45px) в обоих состояниях подписи;
       геометрия не зависит от наличия кнопки (нет Fullscreen API). */
    .char-panel {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 56px;
      display: flex;
      flex-direction: column;
      color: #e8dcc0;
      font: 13px/1.45 ui-monospace, monospace;
      background: rgba(16, 18, 24, 0.92);
      border: 1px solid #4a4433;
      border-radius: 12px;
      padding: 12px 14px;
      z-index: 10;
    }
    .cp-columns { display: flex; flex: 1; gap: 12px; min-height: 0; }
    .cp-column {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      min-height: 0;
    }
    .cp-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
    /* Широкие вкладки (flex:1, padding ≥ 8px) — крупные тач-таргеты;
       стратегия тултипов без hover — 000097. */
    .cp-tab {
      flex: 1;
      padding: 8px 6px;
      font: inherit;
      font-weight: 700;
      border: 1px solid #6b6248;
      border-radius: 6px;
      background: #2c3040;
      color: #e8dcc0;
      cursor: pointer;
    }
    .cp-tabpane { flex: 1; overflow-y: auto; min-height: 0; }
    .cp-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .cp-stats { white-space: pre-line; margin-bottom: 8px; color: #bfe3c0; }
    /* Панель — flex-контейнер: float в нём не работает. */
    .cp-close { align-self: flex-end; }
    .cp-section { margin-top: 10px; font-weight: 700; color: #d8c27a; }
    .cp-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
    .cp-table td { padding: 1px 4px; }
    .cp-name { max-width: 190px; }
    .cp-req { color: #9a8f76; font-size: 11px; }
    .cp-level { text-align: right; width: 34px; color: #9fd3ff; }
  .cp-items { margin-top: 4px; }
  .cp-itemrow { display: flex; align-items: center; gap: 4px; padding: 1px 0; }
  .cp-itemrow .cp-itemname { flex: 1; }
  .cp-itemmeta { color: #9a8f76; font-size: 11px; }
  .cp-notice {
    margin-top: 8px; color: #ffd97a; min-height: 16px;
    transition: opacity 0.4s; opacity: 0;
  }
  .cp-itemrow .cp-btn { width: auto; min-width: 24px; padding: 0 5px; }
    .cp-btn {
      width: 24px; height: 20px;
      border: 1px solid #6b6248; border-radius: 5px;
      background: #2c3040; color: #e8dcc0; cursor: pointer;
    }
    .cp-btn:disabled { opacity: 0.3; cursor: default; }
    /* Тултипы навыков/предметов (задача 000097): .cp-tip — скрыт по
       умолчанию, показ ЧИСТЫМ CSS по :hover / :focus-within владельца
       (строка навыка — td.cp-tipcell, строка предмета — .cp-itemrow).
       Скоуп position:relative под .char-panel ОБЯЗАТЕЛЕН: npcUI
       переиспользует .cp-itemrow (оверлей NPC) — попадать туда не
       должно. z-index 11 — внутри stacking-контекста .char-panel
       (z-10, fixed); лестница 10/15/20/30 — в root-контексте. */
    .char-panel .cp-tipcell { position: relative; width: 1px; padding: 0; }
    .char-panel .cp-itemrow { position: relative; }
    .cp-tip {
      position: absolute;
      z-index: 11;
      bottom: calc(100% + 4px);
      min-width: 180px;
      max-width: 300px;
      padding: 6px 8px;
      background: rgba(10, 12, 16, 0.97);
      border: 1px solid #6b6248;
      border-radius: 6px;
      color: #e8dcc0;
      font-size: 11px;
      line-height: 1.4;
      white-space: pre-line;
      overflow-wrap: break-word;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
    }
    .char-panel .cp-tipcell .cp-tip { right: 0; }
    .char-panel .cp-itemrow > .cp-tip { left: 0; }
    .char-panel .cp-itemrow:hover > .cp-tip,
    .char-panel .cp-itemrow:focus-within > .cp-tip,
    .char-panel tr:hover .cp-tip,
    .char-panel tr:focus-within .cp-tip {
      opacity: 1;
      visibility: visible;
    }
    /* Форма игровых настроек (задача 000098): только НОВЫЕ классы
       .cp-set* (свои; чужие .cp-* не трогаются). */
    .cp-set { margin-top: 4px; }
    .cp-setrow { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
    .cp-setlabel { flex: 1; font-size: 12px; }
    .cp-sethead { margin-top: 8px; font-weight: 700; color: #d8c27a; }
    .cp-setinput { width: 76px; background: #101418; color: #e8dcc0;
      border: 1px solid #6b6248; border-radius: 4px; padding: 1px 4px;
      font-size: 12px; }
    .cp-setbtn { width: auto; min-width: 24px; padding: 0 6px; height: 20px;
      border: 1px solid #6b6248; border-radius: 5px; background: #2c3040;
      color: #e8dcc0; cursor: pointer; font-size: 11px; }
    .cp-setall { margin-top: 8px; }
    /* Кнопка полноэкранного режима (задача 000017): правый нижний угол,
       под оверлеями боя/подземелья (z-index 20). */
    .fs-btn {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 15;
      color: #e8dcc0;
      font: 13px/1.4 ui-monospace, monospace;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid #6b6248;
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
    }
    .fs-btn:hover { background: rgba(0, 0, 0, 0.65); }
    /* On-screen-контролы (задачи 000018, 000123, 000121): D-pad внизу
       слева (только схема 'touch'), кнопки [E] (действие) и [I]
       (инвентарь) — внизу справа, пара [I] над [E]; В ОБОИХ схемах
       (000123). Контейнер на весь экран, но прозрачный для событий
       (pointer-events: none) — к канвасу идут колесо/жесты; события
       ловят только сами контролы (.tc-dpad/.tc-action).
       z-index 30 — ВЫШЕ оверлеев боя/подземелья (20): оверлеи не
       перекрывают контролы (000121). Лестница: .char-panel 10 <
       .fs-btn 15 < .combat-overlay/.dungeon-overlay 20 <
       #touch-controls 30. */
    #touch-controls {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      display: none;
    }
    #touch-controls.visible { display: block; }
    .tc-dpad {
      position: absolute;
      pointer-events: auto;
      touch-action: none;
      background: rgba(232, 220, 192, 0.08);
      border: 1px solid rgba(232, 220, 192, 0.28);
      border-radius: 14px;
    }
    .tc-arrow {
      position: absolute;
      color: rgba(232, 220, 192, 0.6);
      font-size: 16px;
      pointer-events: none;
    }
    /* Кнопки [E]/[I] (000123): содержимое — SVG-иконка (assets/ui/),
       буквы убраны; flex-центрирование под img. */
    .tc-action {
      position: absolute;
      pointer-events: auto;
      touch-action: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #6b6248;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .tc-action:active { background: rgba(0, 0, 0, 0.75); }
    .tc-action img {
      width: 60%;
      height: 60%;
      display: block;
    }
    .combat-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 12, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 20;
      color: #e8dcc0;
      font: 13px/1.5 ui-monospace, monospace;
    }
    .combat-box { position: relative; }
    .combat-box canvas {
      display: block;
      border: 2px solid #4a4433;
      border-radius: 8px;
      cursor: crosshair;
    }
    .combat-side {
      width: 320px;
      background: rgba(16, 18, 24, 0.95);
      border: 1px solid #4a4433;
      border-radius: 12px;
      padding: 12px 14px;
    }
    .combat-state {
      white-space: pre-line;
      color: #bfe3c0;
      margin-bottom: 10px;
    }
    /* Строка очерёдности хода (задача 000036): токены — герой (ромб)
       и мобы (цвет роли + уровень), первая строка .combat-side.
       Только НОВЫЕ классы — .combat-side/.combat-state и верстка
       NPC-диалога/подземелья не меняются. */
    .combat-turnorder {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 10px;
    }
    .turn-token {
      width: 24px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #6b6248;
      border-radius: 4px;
      background: #2c3040;
      color: #e8dcc0;
      font: 700 11px ui-monospace, monospace;
    }
    .turn-token--hero { color: #8cf2fc; background: #12262e; }
    .turn-token--current {
      border-color: #ffe27a;
      box-shadow: 0 0 8px rgba(255, 226, 122, 0.55);
      cursor: pointer;
    }
    .turn-token--acted { opacity: 0.45; }
    .turn-token--dead,
    .turn-token--fled {
      /* После --acted в правиле — визуальный приоритет: мёртвый/сбежавший
         серый и перечёркнутый даже если «уже ходил». */
      opacity: 0.3;
      filter: grayscale(1);
      text-decoration: line-through;
    }
    /* Полоса HP героя (задача 000038): второй элемент .combat-side —
       после строки очереди хода, перед .combat-state. Дорожка
       #3a0d0d — та же, что подполоса мобов на canvas: при frac 0
       «пустая» полоса видна. Ширина/цвет заполнения и текст
       «HP x/y» — из render() (src/combat-ui.js). Только НОВЫЕ классы
       — .combat-side/.combat-state и верстка NPC-диалога/подземелья
       не меняются (они .combat-hpbar не создают). */
    .combat-hpbar {
      position: relative;
      height: 16px;
      margin-bottom: 10px;
      background: #3a0d0d;
      border-radius: 3px;
      overflow: hidden;
    }
    .combat-hpbar-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 100%;
      background: #6fdc6f;
    }
    .combat-hpbar-text {
      position: relative;
      display: block;
      text-align: center;
      line-height: 16px;
      font: 700 11px ui-monospace, monospace;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.9);
    }
    /* Кнопки действий — только бой (grep по src/): ЧЕТЫРЕ колонки
       (8 кнопок = 2 ряда) и иконные кнопки БЕЗ текстовой подписи
       (задача 000124; иконки assets/ui/combat_*.svg). */
    .combat-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .combat-actions button {
      border: 1px solid #6b6248;
      border-radius: 6px;
      background: #2c3040;
      color: #e8dcc0;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1 / 1;
    }
    .combat-actions button img {
      width: 68%;
      height: 68%;
      display: block;
    }
    .combat-actions button:disabled { opacity: 0.3; cursor: default; }
    .combat-log {
      height: 170px;
      overflow-y: auto;
      white-space: pre-line;
      color: #cfc6ad;
      border-top: 1px solid #3a3527;
      padding-top: 8px;
    }
    .combat-banner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: pre-line;
      font-size: 22px;
      font-weight: 700;
      background: rgba(10, 12, 16, 0.85);
      border-radius: 8px;
      cursor: pointer;
    }
    /* Экран боя (задача 000124): поле + ВСЕ панели вписаны во вьюпорт
       без скролла (десктоп + мобильные). Поле (canvas 336×336 внутри)
       масштабируется ЧИСТЫМ CSS под доступную высоту:
       width: min(100vh - 32, 100vw - 304) + aspect-ratio 1/1
       (32 = padding 16×2; 304 = padding 32 + gap 16 + панель 256
       border-box) — формула сама вписывает layout: полная ширина
       W + 304 ≤ 100vw, полная высота W + 32 ≤ 100vh. Панель —
       flex-колонка компактной ширины 256px (4 кнопки × ~52px),
       лог — flex: 1 (всё оставшееся место под кнопками). ВСЯ
       геометрия боя — только в скоупе .combat-overlay--combat:
       базовые .combat-overlay/.combat-side/.combat-log НЕ ТРОГАЕМ
       (чужие оверлеи: подземелье, NPC, постройка; контракт —
       memory/000124-combat-layout.md). image-rendering: pixelated —
       пиксельный арт 336→~700 без сглаживания. */
    .combat-overlay--combat {
      padding: 16px;
      align-items: stretch;
    }
    .combat-overlay--combat .combat-box {
      flex: 0 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .combat-overlay--combat .combat-box canvas {
      box-sizing: border-box;
      display: block;
      aspect-ratio: 1 / 1;
      height: auto;
      width: min(100vh - 32px, 100vw - 304px);
      max-width: 100%;
      image-rendering: pixelated;
    }
    .combat-overlay--combat .combat-side {
      box-sizing: border-box;
      flex: 0 0 auto;
      width: 256px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .combat-overlay--combat .combat-log {
      flex: 1 1 auto;
      min-height: 0;
      height: auto;
    }
    /* Баннер результата (ревью 2026-10-01): на master .combat-box был
       ровно размером с canvas, поэтому баннер (absolute inset 0)
       покрывал поле. Теперь box растягивается (row — на высоту
       оверлея, portrait — на остаток колонки), поэтому в боевом
       скоупе баннер центрируется и ограничивается РАЗМЕРОМ CANVAS
       (та же формула, что у canvas ниже/в медиа-правилах): фон и
       зона клика finish() совпадают с полем, как на master. */
    .combat-overlay--combat .combat-banner {
      top: 50%;
      left: 50%;
      right: auto;
      bottom: auto;
      transform: translate(-50%, -50%);
      width: min(100vh - 32px, 100vw - 304px);
      height: min(100vh - 32px, 100vw - 304px);
    }
    /* Портретный мобильный (задача 000124): КОЛОНКА — поле по
       ШИРИНЕ (приоритет ТЗ: вписалось > полная высота), панель под
       ним во всю ширину, кнопки остаются в 4 колонки (крупнее —
       удобнее тапать), лог flex: 1 (min-height 0 из скоупа —
       скроллится). БЮДЖЕТ ПАНЕЛИ 512px (ревью 2026-10-01):
       естественная высота панели с заполненным журналом (до 9 строк)
       и кнопками, РАСТАЩИМИСЯ с шириной, превышает 512 — без капа
       canvas вылезал за верх вьюпорта (390×844, 568×748, 430×932).
       Формула canvas (−520 = gap 8 + кап 512) гарантирует
       поле+gap+панель+padding ≤ 100vh при ЛЮБОМ содержимом панели.
       Брейкпоинт 640px + portrait — решение Проектирования: узкий
       альбомный 568×320 и 844×390 остаются в row (844 > 640).
       Медиа-правила ИДУТ ПОСЛЕ основного скоуп-блока (та же
       специфичность — победа по порядку каскада). */
    @media (max-width: 640px) and (orientation: portrait) {
      .combat-overlay--combat {
        flex-direction: column;
        padding: 8px;
        gap: 8px;
      }
      .combat-overlay--combat .combat-box {
        flex: 1 1 auto;
        min-height: 0;
      }
      /* Ревью 2026-10-01: 100% УБРАНО — в колонке (базовое
         align-items: center) ширина box = shrink-to-fit canvas:
         циркулярный процент (риск схлопнуться в 0 px); доступная
         ширина = 100vw − 16 (padding 8×2) — абсолютная длина.
         520 = gap 8 + кап панели 512 (max-height ниже): поле+gap+
         панель+padding ≤ 100vh при ЛЮБОМ содержимом панели. */
      .combat-overlay--combat .combat-box canvas {
        width: min(100vw - 16px, 100vh - 16px - 520px);
      }
      .combat-overlay--combat .combat-side {
        flex: 0 0 auto;
        width: 100%;
        max-height: 512px;
        min-height: 0;
      }
      .combat-overlay--combat .combat-banner {
        width: min(100vw - 16px, 100vh - 16px - 520px);
        height: min(100vw - 16px, 100vh - 16px - 520px);
      }
    }
    /* Подземелье (задача 000066): вьюпорт на весь экран — тот же
       движок, что мир: canvas fullscreen (absolute inset 0), камера
       заменяет прокрутку (overflow: auto УБРАН), фон непрозрачный
       (мир позади оверлея больше не проступает), панель .combat-side —
       плавающая справа. CSS боя (.combat-overlay без dungeon-класса)
       и NPC-оверлей не тронуты. */
    .dungeon-overlay {
      display: block;
      background: #0a0d12;
      overflow: hidden;
    }
    .dungeon-overlay canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 0;
    }
    .dungeon-overlay .combat-side {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 270px;
      background: rgba(16, 18, 24, 0.85);
    }
    /* Диалог NPC на весь экран (задача 000125, диалог — 000010):
       ДЕКЭПЛИНГ от боя — панель СВОЙ класс .npc-panel (не
       .combat-side), поэтому layout диалога не зависит от геометрии
       боевой панели при ЛЮБОМ порядке мержей 000124/000125.
       Оверлей держит .combat-overlay как полноэкранный слой (fixed
       inset:0, z-20, шрифт) + маркер .npc-overlay (фильтр
       building-effects и скоуп ниже). Блок — В КОНЦЕ <style>:
       display: block перебивает flex-center базы .combat-overlay по
       порядку каскада (прецедент .dungeon-overlay, 000066); тёмный
       «рамочный» фон базы гасится непрозрачной подложкой.
       Панель — flex-колонка 100%×100%: заголовок и строка вкладок —
       фиксированы сверху (вкладки — wrap: 5 подписей впритык при
       320px), тело .cp-items — основной скролл (flex: 1 +
       min-height: 0), лог — фиксированная зона внизу (max-height
       vh, свой скролл; автораскрутка — ui.js). Заголовок — ВЕСЬ
       экран (кнопка «закрыть» у правого края); колонка контента
       (вкладки/тело/лог) — max-width 680px по центру (читабельность
       на широких экранах), фон панели — весь экран. Состав панели
       и обработчики (npcBuild) не меняются; боевой/подземельный/
       построечный оверлеи не затрагиваются. Контракт:
       memory/000125-npc-fullscreen.md. */
    .npc-overlay {
      display: block;
      background: #101418;
    }
    .npc-panel {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      padding: 12px 14px;
      background: rgba(16, 18, 24, 0.95);
    }
    .npc-panel .cp-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex: 0 0 auto;
    }
    .npc-panel > .cp-itemrow {
      flex: 0 0 auto;
      flex-wrap: wrap;
    }
    .npc-panel .cp-items {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
    }
    .npc-panel > .cp-itemrow,
    .npc-panel .cp-items,
    .npc-log {
      width: 100%;
      max-width: 680px;
      margin-left: auto;
      margin-right: auto;
    }
    .npc-log {
      flex: 0 0 auto;
      max-height: 30vh;
      overflow-y: auto;
    }
  </style>
</head>
