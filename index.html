<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Приключения Флогистона</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #101418;
    }
    #game {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hud {
      position: fixed;
      left: 12px;
      top: 12px;
      color: #e8dcc0;
      font: 13px/1.55 ui-monospace, monospace;
      background: rgba(0, 0, 0, 0.45);
      padding: 10px 14px;
      border-radius: 10px;
      pointer-events: none;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">Загрузка мира…</div>
  <!-- Обычные <script> (не модули): игра открывается двойным кликом
       по index.html без локального сервера. API собирается в globalThis.Game. -->
  <script src="src/perlin.js"></script>
  <script src="src/mapseed.js"></script>
  <script src="src/map.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
