<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- user-scalable=no — игра: браузерный pinch-zoom ломает on-screen-
       контролы (задача 000018); зум в игре — свой (колесо мыши). -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Приключения Флогистона</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #101418;
    }
    #game {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Слой спрайтов поверх WebGL-канваса (текстуры тайлов, постройки, мобы,
       Флогистон). Клик/колесо должны проходить к #game, поэтому
       pointer-events: none. */
    #sprites {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #hud {
      position: fixed;
      left: 12px;
      top: 12px;
      color: #e8dcc0;
      font: 13px/1.55 ui-monospace, monospace;
      background: rgba(0, 0, 0, 0.45);
      padding: 10px 14px;
      border-radius: 10px;
      pointer-events: none;
      white-space: pre-line;
    }
    /* Полноэкранная двухколоночная панель (задача 000096): накрывает
       карту; bottom:56px — нижняя кромка ВЫШЕ верхней кромки .fs-btn
       (bottom 12 + высота ≈33px = 45px) в обоих состояниях подписи;
       геометрия не зависит от наличия кнопки (нет Fullscreen API). */
    .char-panel {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 56px;
      display: flex;
      flex-direction: column;
      color: #e8dcc0;
      font: 13px/1.45 ui-monospace, monospace;
      background: rgba(16, 18, 24, 0.92);
      border: 1px solid #4a4433;
      border-radius: 12px;
      padding: 12px 14px;
      z-index: 10;
    }
    .cp-columns { display: flex; flex: 1; gap: 12px; min-height: 0; }
    .cp-column {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      min-height: 0;
    }
    .cp-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
    /* Широкие вкладки (flex:1, padding ≥ 8px) — крупные тач-таргеты;
       стратегия тултипов без hover — 000097. */
    .cp-tab {
      flex: 1;
      padding: 8px 6px;
      font: inherit;
      font-weight: 700;
      border: 1px solid #6b6248;
      border-radius: 6px;
      background: #2c3040;
      color: #e8dcc0;
      cursor: pointer;
    }
    .cp-tabpane { flex: 1; overflow-y: auto; min-height: 0; }
    .cp-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .cp-stats { white-space: pre-line; margin-bottom: 8px; color: #bfe3c0; }
    /* Панель — flex-контейнер: float в нём не работает. */
    .cp-close { align-self: flex-end; }
    .cp-section { margin-top: 10px; font-weight: 700; color: #d8c27a; }
    .cp-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
    .cp-table td { padding: 1px 4px; }
    .cp-name { max-width: 190px; }
    .cp-req { color: #9a8f76; font-size: 11px; }
    .cp-level { text-align: right; width: 34px; color: #9fd3ff; }
  .cp-items { margin-top: 4px; }
  .cp-itemrow { display: flex; align-items: center; gap: 4px; padding: 1px 0; }
  .cp-itemrow .cp-itemname { flex: 1; }
  .cp-itemmeta { color: #9a8f76; font-size: 11px; }
  .cp-notice {
    margin-top: 8px; color: #ffd97a; min-height: 16px;
    transition: opacity 0.4s; opacity: 0;
  }
  .cp-itemrow .cp-btn { width: auto; min-width: 24px; padding: 0 5px; }
    .cp-btn {
      width: 24px; height: 20px;
      border: 1px solid #6b6248; border-radius: 5px;
      background: #2c3040; color: #e8dcc0; cursor: pointer;
    }
    .cp-btn:disabled { opacity: 0.3; cursor: default; }
    /* Тултипы навыков/предметов (задача 000097): .cp-tip — скрыт по
       умолчанию, показ ЧИСТЫМ CSS по :hover / :focus-within владельца
       (строка навыка — td.cp-tipcell, строка предмета — .cp-itemrow).
       Скоуп position:relative под .char-panel ОБЯЗАТЕЛЕН: npcUI
       переиспользует .cp-itemrow (оверлей NPC) — попадать туда не
       должно. z-index 11 — внутри stacking-контекста .char-panel
       (z-10, fixed); лестница 5/10/15/20 — в root-контексте. */
    .char-panel .cp-tipcell { position: relative; width: 1px; padding: 0; }
    .char-panel .cp-itemrow { position: relative; }
    .cp-tip {
      position: absolute;
      z-index: 11;
      bottom: calc(100% + 4px);
      min-width: 180px;
      max-width: 300px;
      padding: 6px 8px;
      background: rgba(10, 12, 16, 0.97);
      border: 1px solid #6b6248;
      border-radius: 6px;
      color: #e8dcc0;
      font-size: 11px;
      line-height: 1.4;
      white-space: pre-line;
      overflow-wrap: break-word;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
    }
    .char-panel .cp-tipcell .cp-tip { right: 0; }
    .char-panel .cp-itemrow > .cp-tip { left: 0; }
    .char-panel .cp-itemrow:hover > .cp-tip,
    .char-panel .cp-itemrow:focus-within > .cp-tip,
    .char-panel tr:hover .cp-tip,
    .char-panel tr:focus-within .cp-tip {
      opacity: 1;
      visibility: visible;
    }
    /* Кнопка полноэкранного режима (задача 000017): правый нижний угол,
       под оверлеями боя/подземелья (z-index 20). */
    .fs-btn {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 15;
      color: #e8dcc0;
      font: 13px/1.4 ui-monospace, monospace;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid #6b6248;
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
    }
    .fs-btn:hover { background: rgba(0, 0, 0, 0.65); }
    /* On-screen-контролы для тачскрина (задача 000018): D-pad внизу
       слева, кнопка «E» — внизу справа. Контейнер на весь экран, но
       прозрачный для событий (pointer-events: none) — к канвасу идут
       колесо/жесты; события ловят сами контролы. z-index 5 — под
       панелями (10) и оверлеями боя/диалога (20). */
    #touch-controls {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      display: none;
    }
    #touch-controls.visible { display: block; }
    .tc-dpad {
      position: absolute;
      pointer-events: auto;
      touch-action: none;
      background: rgba(232, 220, 192, 0.08);
      border: 1px solid rgba(232, 220, 192, 0.28);
      border-radius: 14px;
    }
    .tc-arrow {
      position: absolute;
      color: rgba(232, 220, 192, 0.6);
      font-size: 16px;
      pointer-events: none;
    }
    .tc-action {
      position: absolute;
      pointer-events: auto;
      touch-action: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #6b6248;
      color: #e8dcc0;
      font: 700 18px/1 ui-monospace, monospace;
      cursor: pointer;
    }
    .tc-action:active { background: rgba(0, 0, 0, 0.75); }
    .combat-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 12, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 20;
      color: #e8dcc0;
      font: 13px/1.5 ui-monospace, monospace;
    }
    .combat-box { position: relative; }
    .combat-box canvas {
      display: block;
      border: 2px solid #4a4433;
      border-radius: 8px;
      cursor: crosshair;
    }
    .combat-side {
      width: 320px;
      background: rgba(16, 18, 24, 0.95);
      border: 1px solid #4a4433;
      border-radius: 12px;
      padding: 12px 14px;
    }
    .combat-state {
      white-space: pre-line;
      color: #bfe3c0;
      margin-bottom: 10px;
    }
    /* Строка очерёдности хода (задача 000036): токены — герой (ромб)
       и мобы (цвет роли + уровень), первая строка .combat-side.
       Только НОВЫЕ классы — .combat-side/.combat-state и верстка
       NPC-диалога/подземелья не меняются. */
    .combat-turnorder {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 10px;
    }
    .turn-token {
      width: 24px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #6b6248;
      border-radius: 4px;
      background: #2c3040;
      color: #e8dcc0;
      font: 700 11px ui-monospace, monospace;
    }
    .turn-token--hero { color: #8cf2fc; background: #12262e; }
    .turn-token--current {
      border-color: #ffe27a;
      box-shadow: 0 0 8px rgba(255, 226, 122, 0.55);
      cursor: pointer;
    }
    .turn-token--acted { opacity: 0.45; }
    .turn-token--dead,
    .turn-token--fled {
      /* После --acted в правиле — визуальный приоритет: мёртвый/сбежавший
         серый и перечёркнутый даже если «уже ходил». */
      opacity: 0.3;
      filter: grayscale(1);
      text-decoration: line-through;
    }
    /* Полоса HP героя (задача 000038): второй элемент .combat-side —
       после строки очереди хода, перед .combat-state. Дорожка
       #3a0d0d — та же, что подполоса мобов на canvas: при frac 0
       «пустая» полоса видна. Ширина/цвет заполнения и текст
       «HP x/y» — из render() (src/combat-ui.js). Только НОВЫЕ классы
       — .combat-side/.combat-state и верстка NPC-диалога/подземелья
       не меняются (они .combat-hpbar не создают). */
    .combat-hpbar {
      position: relative;
      height: 16px;
      margin-bottom: 10px;
      background: #3a0d0d;
      border-radius: 3px;
      overflow: hidden;
    }
    .combat-hpbar-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 100%;
      background: #6fdc6f;
    }
    .combat-hpbar-text {
      position: relative;
      display: block;
      text-align: center;
      line-height: 16px;
      font: 700 11px ui-monospace, monospace;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.9);
    }
    .combat-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }
    .combat-actions button {
      border: 1px solid #6b6248;
      border-radius: 6px;
      background: #2c3040;
      color: #e8dcc0;
      cursor: pointer;
      padding: 4px 6px;
    }
    .combat-actions button:disabled { opacity: 0.3; cursor: default; }
    .combat-log {
      height: 170px;
      overflow-y: auto;
      white-space: pre-line;
      color: #cfc6ad;
      border-top: 1px solid #3a3527;
      padding-top: 8px;
    }
    .combat-banner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: pre-line;
      font-size: 22px;
      font-weight: 700;
      background: rgba(10, 12, 16, 0.85);
      border-radius: 8px;
      cursor: pointer;
    }
    /* Подземелье (задача 000066): вьюпорт на весь экран — тот же
       движок, что мир: canvas fullscreen (absolute inset 0), камера
       заменяет прокрутку (overflow: auto УБРАН), фон непрозрачный
       (мир позади оверлея больше не проступает), панель .combat-side —
       плавающая справа. CSS боя (.combat-overlay без dungeon-класса)
       и NPC-оверлей не тронуты. */
    .dungeon-overlay {
      display: block;
      background: #0a0d12;
      overflow: hidden;
    }
    .dungeon-overlay canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 0;
    }
    .dungeon-overlay .combat-side {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 270px;
      background: rgba(16, 18, 24, 0.85);
    }
    /* Диалог NPC (задача 000010): оверлей .combat-overlay с панелью
       .combat-side; длинные списки — прокрутка внутри панели и лога. */
    .npc-overlay .combat-side { max-height: 84vh; overflow-y: auto; }
    .npc-log { max-height: 140px; overflow-y: auto; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="sprites"></canvas>
  <div id="hud">Загрузка мира…</div>
  <!-- Обычные <script> (не модули): игра открывается двойным кликом
       по index.html без локального сервера. API собирается в globalThis.Game. -->
  <script src="src/global-settings.js"></script>
  <script src="src/perlin.js"></script>
  <script src="src/mapseed.js"></script>
  <script src="src/skills-data.js"></script>
  <script src="src/items-data.js"></script>
  <script src="src/npc-data.js"></script>
  <!-- Каталог стационарных групп мобов (assets/mob_groups, задача
       000057): ДО map.js — ленивые mobGroupCount()/mobGroupName()
       видят Game.MobGroupsData при вызове; combat.js/sprites.js
       читают каталог при своей загрузке. -->
  <script src="src/mob-groups-data.js"></script>
  <script src="src/map.js"></script>
  <script src="src/player.js"></script>
  <script src="src/day.js"></script>
  <script src="src/items.js"></script>
  <script src="src/buildings.js"></script>
  <script src="src/npc.js"></script>
  <script src="src/companions.js"></script>
  <!-- Реестр эффектов построек (задача 000071): после buildings.js/npc.js
       (каталожная часть цепочки), ДО main.js (UMD-ловушка 000038:
       main.js снимает Game один раз). Чистый модуль — взаимных require
       в момент загрузки нет (прецедент 000053). -->
  <script src="src/building-effects.js"></script>
  <script src="src/combat.js"></script>
  <script src="src/spells-data.js"></script>
  <script src="src/spells.js"></script>
  <script src="src/dungeons-data.js"></script>
  <script src="src/craft-data.js"></script>
  <script src="src/craft.js"></script>
  <script src="src/dungeon.js"></script>
  <script src="src/cities.js"></script>
  <!-- Локации (задача 000127, разбиение main.js 1/4): состояние и
       переходы подземелья/города. После dungeon.js/cities.js
       (доменная группа), ДО main.js (UMD-ловушка 000038: main.js
       снимает Game один раз — const G = globalThis.Game). Чистый
       модуль — ноль зависимостей в момент загрузки (000053/000071),
       Game-функции лениво в момент вызова. -->
  <script src="src/locations.js"></script>
  <!-- Порядок здесь ВАЖЕН (задача 000018, регрессия проверена в
       tests/index-order.test.js): controls.js ДО ui.js — Game.touchControls
       в ui.js собирается при ЗАГРУЗКЕ из Game.layoutTouchControls/touchActionAt,
       и если controls.js загружен позже, тач-контролы никогда не создаются.
       controls.js ДО combat-keys.js — таблица боя строит строки движения
       из Game.CODE_DIRS/Game.DIR_DELTA (задача 000048); combat-keys.js
       ДО combat-ui.js — keydown и подписи кнопок боя берутся из
       Game.CombatKeys. sprites.js ДО combat-ui.js — каждый UMD-модуль
       ЗАМЕНЯЕТ объект Game (Object.assign({}, Game, ...)), а combat-ui.js
       снимает его один раз при загрузке (const G = globalThis.Game):
       функция из скрипта, загруженного ПОЗЖЕ, через этот G недоступна
       никогда (задача 000038 — цвет полосы HP героя). ui.js до main.js —
       main.js использует Game.playerUI/touchControls. -->
  <script src="src/controls.js"></script>
  <script src="src/combat-keys.js"></script>
  <script src="src/ui.js"></script>
  <!-- Оверлей «действия постройки» (задача 000071): после ui.js
       (оверлей по образцу npcUI), ДО main.js (UMD-ловушка 000038).
       При загрузке DOM не трогает (vm-песочницы подхватывают скрипт
       из CHAIN — не роняют загрузку). -->
  <script src="src/building-ui.js"></script>
  <script src="src/visuals-data.js"></script>
  <script src="src/sprites.js"></script>
  <script src="src/combat-ui.js"></script>
  <script src="src/dungeon-ui.js"></script>
  <script src="src/fullscreen.js"></script>
  <script src="src/save.js"></script>
  <script src="src/motion.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
