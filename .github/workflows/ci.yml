# CI и публикация на GitHub Pages (задача 000054).
#
# Триггеры: push в master + ручной workflow_dispatch (перепубликация).
# Job test: npm test + дрейф-гейт JS-зеркал (node scripts/sync-all.js
# --check) — рассинхрон JSON <-> src/*-data.js = красный CI.
# Job deploy-pages (needs: test): публикация артефакта — явного списка
# index.html + src + assets (НЕ корня репозитория: в сайт не попадают
# tasks/, memory/, tests/, scripts/, .github/) — на GitHub Pages через
# actions/deploy-pages, OIDC (permissions в workflow, без токена).
#
# Шага установки зависимостей нет намеренно: в проекте ноль
# зависимостей и нет package-lock.json (если появятся зависимости —
# добавить сюда установку).
#
# ВАЖНО: формат файла зафиксирован тестами tests/ci.test.js (ноль
# зависимостей — YAML-парсера нет, только строковые ассерты).
# Flow-списки (branches: [ master ], path: [ index.html, src, assets ])
# и environment в строковой форме не переформатировать.

name: CI и Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Тесты и синхронность JS-бандлов
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Тесты
        run: npm test
      - name: «Сборка» JSON-каталогов в JS-бандлы (дрейф = ошибка)
        run: node scripts/sync-all.js --check

  deploy-pages:
    name: Публикация на GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Загрузить артефакт (index.html + src + assets)
        uses: actions/upload-pages-artifact@v5
        with:
          path: [ index.html, src, assets ]
      - name: Деплой
        id: deployment
        uses: actions/deploy-pages@v5
